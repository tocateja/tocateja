[build]
  # Omite el build cuando un commit solo toca datos (productos.json / resenas.json).
  # Robusto ante el caso "sin cache" de Netlify (CACHED_COMMIT_REF == COMMIT_REF),
  # que antes cancelaba TODOS los builds: en ese caso compara el commit con su padre.
  # Si algo falla, la comparacion devuelve error (!=0) y el build SE EJECUTA (fail-open).
  ignore = "if [ \"$CACHED_COMMIT_REF\" = \"$COMMIT_REF\" ]; then git diff --quiet HEAD^ HEAD -- . ':!productos.json' ':!resenas.json'; else git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':!productos.json' ':!resenas.json'; fi"
